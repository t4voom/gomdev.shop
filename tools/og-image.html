<!DOCTYPE html>
<!-- Modelo usado para gerar assets/og-image.jpg (1200×630) com tools/generate-images.mjs -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
  @font-face { font-family: "Inter"; font-weight: 400 700; src: url("../assets/fonts/inter-latin-var.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(60% 70% at 80% 100%, rgba(10,132,255,.12), transparent 70%), #fff; }
  .og__text { position: absolute; left: 72px; top: 80px; width: 520px; }
  .og .logo { height: 30px; }
  .og__eyebrow { margin-top: 64px; font-size: 22px; font-weight: 600; color: #6e6e73; }
  .og__title { margin-top: 12px; font-size: 66px; font-weight: 700; line-height: 1.03; letter-spacing: -.035em; color: #1d1d1f; }
  .og__sub { margin-top: 22px; font-size: 22px; color: #6e6e73; }
  .og__devices { position: absolute; left: 560px; top: 120px; width: 700px; }
  .og .devices { width: 100%; }
  .og .laptop__screen img, .og .phone__viewport img { content-visibility: visible; }
</style>
</head>
<body>
<div class="og">
  <div class="og__text">
    <svg class="logo" viewBox="0 0 131 34" aria-hidden="true"><g fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="17" r="7"/><path d="M15.5 10V25a7 7 0 0 1-13.06 3.5"/><circle cx="29" cy="17" r="7"/><path d="M42.5 24V14.5a4.5 4.5 0 0 1 9 0V24M51.5 14.5a4.5 4.5 0 0 1 9 0V24"/><circle cx="74" cy="17" r="7"/><path d="M81 2V24"/><path d="M87.5 17h14a7 7 0 1 0-2.05 4.95"/><path d="M108 10l6.5 14L121 10"/></g><circle cx="128" cy="23" r="2.5" fill="#0071e3"/></svg>
    <p class="og__eyebrow">Sites e apps · Blumenau, SC</p>
    <p class="og__title">Seu negócio merece um site <span class="text-gradient">à&nbsp;altura.</span></p>
    <p class="og__sub">gomdev.shop</p>
  </div>
  <div class="og__devices">
    <div class="devices">
      <div class="laptop"><div class="laptop__lid"><div class="laptop__screen"><img src="../assets/portfolio/prince-desktop.webp" alt=""></div></div><div class="laptop__base"></div></div>
      <div class="phone devices__phone"><div class="phone__body"><div class="phone__screen"><span class="phone__status"><span>9:41</span><span class="phone__bars"></span></span><div class="phone__viewport"><img src="../assets/portfolio/prince-mobile.webp" alt=""></div><span class="phone__island"></span></div></div></div>
    </div>
  </div>
</div>
</body>
</html>
