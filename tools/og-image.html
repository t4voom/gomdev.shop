<!DOCTYPE html>
<!-- Modelo usado para gerar assets/og-image.jpg (1200×630). Abra via servidor local e tire um print. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; color: #f5f5f7; }
  .og .glow { top: 10%; left: 72%; width: 1100px; }
  .og__grid { position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgba(255,255,255,.1) 1px, transparent 1.5px); background-size: 30px 30px; -webkit-mask-image: radial-gradient(ellipse 50% 60% at 30% 40%, #000, transparent 80%); mask-image: radial-gradient(ellipse 50% 60% at 30% 40%, #000, transparent 80%); }
  .og__text { position: absolute; left: 72px; top: 76px; width: 560px; }
  .og .logo { height: 34px; color: #f5f5f7; }
  .og__eyebrow { margin-top: 72px; font-size: 22px; font-weight: 600; color: #2997ff; }
  .og__title { margin-top: 14px; font-size: 68px; font-weight: 700; line-height: 1.03; letter-spacing: -.03em; }
  .og__sub { margin-top: 24px; font-size: 22px; color: #a1a1a6; }
  .og__browser { position: absolute; left: 610px; top: 150px; width: 720px; }
  .og__phone { position: absolute; left: 900px; top: 196px; width: 210px; }
</style>
</head>
<body>
<div class="og" data-theme="dark">
  <div class="glow"></div>
  <div class="og__grid"></div>
  <div class="og__text">
    <svg class="logo" viewBox="0 0 131 34" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8.5" cy="17" r="7"/><path d="M15.5 10V25a7 7 0 0 1-13.06 3.5"/>
        <circle cx="29" cy="17" r="7"/>
        <path d="M42.5 24V14.5a4.5 4.5 0 0 1 9 0V24M51.5 14.5a4.5 4.5 0 0 1 9 0V24"/>
        <circle cx="74" cy="17" r="7"/><path d="M81 2V24"/>
        <path d="M87.5 17h14a7 7 0 1 0-2.05 4.95"/>
        <path d="M108 10l6.5 14L121 10"/>
      </g>
      <circle class="logo__dot" cx="128" cy="23" r="2.5"/>
    </svg>
    <p class="og__eyebrow">Criação de sites para negócios locais</p>
    <p class="og__title">Seu negócio merece um site <span class="text-gradient">à&nbsp;altura.</span></p>
    <p class="og__sub">gomdev.shop · Blumenau, SC</p>
  </div>
  <div class="og__browser browser"><div class="browser__body">
    <div class="browser__bar"><span class="browser__dots"><i></i><i></i><i></i></span><span class="browser__url">aurorapet.com.br</span></div>
    <img class="browser__screen" src="../assets/mockups/aurora-desktop.svg" width="1280" height="800" alt="">
  </div></div>
  <div class="og__phone phone"><div class="phone__body"><div class="phone__screen">
    <img src="../assets/mockups/brasa-mobile.svg" width="390" height="844" alt=""><span class="phone__island"></span>
  </div></div></div>
</div>
</body>
</html>
