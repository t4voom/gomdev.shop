<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Modelo de portfólio</title>
<!--
  Sites de demonstração do portfólio (negócios fictícios).
  Usado só pelo tools/portfolio-shots.js para gerar as capturas em
  assets/portfolio/. Abra com ?p=<slug> para ver no navegador.
-->
<style>
@font-face {
  font-family: "Inter";
  src: url("../assets/fonts/inter-latin-var.woff2") format("woff2");
  font-weight: 100 900;
  font-display: block;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-body, "Inter", system-ui, sans-serif);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
svg { display: block; }
.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i--fill { fill: currentColor; stroke: none; }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 56px; }

/* ---------- Navegação ---------- */
.nav { position: relative; z-index: 5; }
.nav__bar { display: flex; align-items: center; gap: 40px; height: 84px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand__mark { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--c1); color: var(--on-c1, #fff); box-shadow: 0 8px 20px -8px var(--c1); }
.brand__mark .i { width: 26px; height: 26px; }
.brand__name { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; line-height: 1; }
.brand__sub { display: block; margin-top: 4px; font-family: var(--font-body, "Inter"); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--c2); }
.nav__links { display: flex; gap: 30px; margin-left: auto; font-size: 15px; font-weight: 500; color: var(--muted); }
.nav__cta { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; background: var(--c2); color: var(--on-c2, #fff); font-size: 15px; font-weight: 700; }
.nav__menu { display: none; width: 46px; height: 46px; margin-left: auto; place-items: center; border-radius: 14px; background: var(--soft); color: var(--ink); }

/* ---------- Topo ---------- */
.hero { position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: -20% -10% auto 40%; height: 900px; background: radial-gradient(closest-side, var(--glow), transparent); z-index: 0; }
.hero__grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 56px; padding-top: 44px; padding-bottom: 72px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c1-ink, var(--c1)); }
.chip--open { color: #16a34a; background: rgba(22, 163, 74, .09); border-color: rgba(22, 163, 74, .2); }
.chip--open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, .2); }
.hero h1 { margin-top: 26px; font-family: var(--font-display); font-size: var(--h1, 66px); font-weight: var(--h1-weight, 800); line-height: 1.02; letter-spacing: var(--h1-track, -.035em); text-transform: var(--h1-case, none); }
.hero h1 em { font-style: var(--em-style, normal); color: var(--c2); background: linear-gradient(transparent 72%, var(--mark) 72%, var(--mark) 92%, transparent 92%); }
.hero__lead { max-width: 30em; margin-top: 22px; font-size: 19px; line-height: 1.6; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 58px; padding: 0 28px; border-radius: var(--btn-radius, 999px); font-size: 17px; font-weight: 700; }
.btn--main { background: var(--c2); color: var(--on-c2, #fff); box-shadow: 0 14px 30px -12px var(--c2); }
.btn--alt { border: 2px solid var(--line-strong); color: var(--ink); }
.proof { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 30px; font-size: 15px; color: var(--muted); }
.stars { display: flex; gap: 2px; color: #f5a524; }
.stars .i { width: 18px; height: 18px; }
.proof strong { color: var(--ink); }
.proof__item { display: inline-flex; align-items: center; gap: 8px; }
.proof__item .i { color: var(--c1); }

/* Arte do topo: bloco com ícone grande e cartões flutuantes */
.art { position: relative; aspect-ratio: 1 / .92; }
.art__blob { position: absolute; inset: 6% 4% 4% 8%; border-radius: var(--art-radius, 42% 58% 52% 48% / 46% 44% 56% 54%); background: var(--art-bg); box-shadow: 0 40px 80px -40px var(--c1); overflow: hidden; }
.art__blob::before, .art__blob::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .14); }
.art__blob::before { width: 62%; aspect-ratio: 1; right: -14%; top: -18%; }
.art__blob::after { width: 38%; aspect-ratio: 1; left: -10%; bottom: -10%; background: rgba(255, 255, 255, .1); }
.art__photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art__blob:has(.art__photo)::before, .art__blob:has(.art__photo)::after { display: none; }
.art__blob:has(.art__photo) { box-shadow: 0 40px 80px -36px rgba(0, 0, 0, .55); border: 6px solid var(--card); }
.art__icon { position: absolute; inset: 0; display: grid; place-items: center; color: var(--art-ink, #fff); }
.art__icon svg { width: 54%; height: 54%; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .18)); }
.float { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 18px; background: var(--card); color: var(--ink); box-shadow: 0 24px 50px -22px rgba(0, 0, 0, .35); border: 1px solid var(--line); font-size: 14px; line-height: 1.3; }
.float b { display: block; font-size: 15px; }
.float span { color: var(--muted); }
.float__ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--soft); color: var(--c1-ink, var(--c1)); }
.float--a { left: 0; top: 16%; }
.float--b { right: 0; top: 48%; }
.float--c { left: 10%; bottom: 2%; }

/* ---------- Seções ---------- */
.sec { padding: 88px 0; }
.sec--soft { background: var(--soft-bg); }
.sec__eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--c2); }
.sec__title { margin-top: 10px; max-width: 18em; font-family: var(--font-display); font-size: 42px; font-weight: var(--h1-weight, 800); line-height: 1.08; letter-spacing: -.03em; text-transform: var(--h2-case, none); }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
.card { overflow: hidden; padding: 0; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 18px 40px -30px rgba(0, 0, 0, .3); }
.card__media { position: relative; aspect-ratio: 4 / 3; background: var(--soft); }
.card__media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card__body { position: relative; padding: 34px 24px 24px; }
.card__body .card__ic { position: absolute; top: -26px; left: 22px; box-shadow: 0 10px 22px -8px rgba(0,0,0,.4); border: 3px solid var(--card); }
.card__ic { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--c1); color: var(--on-c1, #fff); }
.card__ic .i { width: 26px; height: 26px; }
.card h3 { margin-top: 0; font-size: 19px; letter-spacing: -.01em; }
.card p { margin-top: 8px; font-size: 15px; color: var(--muted); }
.card__link { display: inline-flex; margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--c2); }

.about { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.about__art { position: relative; aspect-ratio: 4 / 3; border-radius: 28px; background: var(--art-bg2, var(--art-bg)); overflow: hidden; display: grid; place-items: center; color: rgba(255, 255, 255, .92); }
.about__art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.about__art:has(img)::before { display: none; }
.about__art svg { width: 34%; height: 34%; }
.about__art::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .06) 0 14px, transparent 14px 28px); }
.about p.txt { margin-top: 16px; font-size: 17px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 30px; }
.stat { padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--c1-ink, var(--c1)); }
.stat span { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }

.reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
.review { padding: 26px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
.review p { margin-top: 14px; font-size: 16px; }
.review__who { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 14px; color: var(--muted); }
.review__who i { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--soft); color: var(--c1-ink, var(--c1)); font-style: normal; font-weight: 800; }
.review__who b { display: block; color: var(--ink); }

.visit { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; margin-top: 40px; }
.hours { padding: 28px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); }
.hours li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--line-strong); font-size: 16px; }
.hours li:last-child { border: 0; }
.hours li span:last-child { font-weight: 700; }
.map { position: relative; min-height: 300px; border-radius: 22px; overflow: hidden; background: var(--map-bg, #e9efe9); border: 1px solid var(--line); }
.map::before { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, transparent 47%, var(--map-road, #fff) 47%, var(--map-road, #fff) 53%, transparent 53%),
  linear-gradient(0deg, transparent 58%, var(--map-road, #fff) 58%, var(--map-road, #fff) 63%, transparent 63%),
  linear-gradient(28deg, transparent 30%, var(--map-road, #fff) 30%, var(--map-road, #fff) 33%, transparent 33%),
  linear-gradient(90deg, var(--map-line, rgba(0,0,0,.05)) 1px, transparent 1px) 0 0 / 40px 40px,
  linear-gradient(0deg, var(--map-line, rgba(0,0,0,.05)) 1px, transparent 1px) 0 0 / 40px 40px; }
.map__pin { position: absolute; left: 50%; top: 44%; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50% 50% 50% 0; background: var(--c2); color: #fff; transform: translate(-50%, -50%) rotate(-45deg); box-shadow: 0 16px 30px -10px var(--c2); }
.map__pin .i { transform: rotate(45deg); width: 26px; height: 26px; }
.map__card { position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 20px 40px -20px rgba(0,0,0,.35); font-size: 14px; }
.map__card b { display: block; font-size: 15px; }
.map__card span { color: var(--muted); }
.map__go { flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--c1); color: var(--on-c1, #fff); font-weight: 700; }

.final { padding: 80px 0; background: var(--final-bg, var(--c1)); color: var(--final-ink, #fff); text-align: center; }
.final h2 { font-family: var(--font-display); font-size: 44px; line-height: 1.08; letter-spacing: -.03em; text-transform: var(--h2-case, none); }
.final p { margin-top: 12px; font-size: 18px; opacity: .85; }
.final .btns { justify-content: center; }
.final .btn--main { background: var(--final-btn, #fff); color: var(--final-btn-ink, var(--c1)); box-shadow: none; }

.foot { padding: 36px 0 40px; background: var(--foot-bg, #0b0f10); color: rgba(255, 255, 255, .7); font-size: 14px; }
.foot__row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.foot .brand__name { color: #fff; }

.dock { display: none; }

/* ---------- Celular ---------- */
body.m { width: 390px; overflow-x: hidden; }
.m .wrap { padding: 0 22px; }
.m .nav__bar { height: 74px; gap: 12px; }
.m .nav__links, .m .nav__cta { display: none; }
.m .nav__menu { display: grid; }
.m .brand__mark { width: 42px; height: 42px; border-radius: 13px; }
.m .brand__name { font-size: 19px; }
.m .hero__grid { grid-template-columns: 1fr; gap: 36px; padding-top: 18px; padding-bottom: 48px; }
.m .chip { height: 32px; padding: 0 13px; font-size: 11.5px; }
.m .hero h1 { margin-top: 20px; font-size: var(--h1-m, 44px); }
.m .hero__lead { margin-top: 16px; font-size: 17px; }
.m .btns { flex-direction: column; gap: 12px; margin-top: 26px; }
.m .btn { height: 56px; width: 100%; }
.m .proof { gap: 10px 16px; margin-top: 24px; font-size: 14px; }
.m .art { aspect-ratio: 1 / .95; }
.m .float { padding: 11px 13px; border-radius: 15px; font-size: 12px; gap: 10px; }
.m .float b { font-size: 13px; }
.m .float__ic { width: 34px; height: 34px; border-radius: 10px; }
.m .float__ic .i { width: 18px; height: 18px; }
.m .sec { padding: 60px 0; }
.m .sec__title { font-size: 32px; }
.m .cards, .m .reviews, .m .about, .m .visit { grid-template-columns: 1fr; gap: 14px; margin-top: 28px; }
.m .about { gap: 28px; margin-top: 0; }
.m .card { display: grid; grid-template-columns: 112px 1fr; }
.m .card__media { aspect-ratio: auto; min-height: 100%; }
.m .card__body { padding: 18px 18px 18px 18px; }
.m .card__body .card__ic { display: none; }
.m .card h3 { margin-top: 0; font-size: 18px; }
.m .card p { margin-top: 4px; font-size: 14.5px; }
.m .card__link { margin-top: 8px; }
.m .stats { gap: 10px; }
.m .stat { padding: 14px 12px; }
.m .stat b { font-size: 24px; }
.m .final { padding: 60px 0 64px; }
.m .final h2 { font-size: 34px; }
.m .final .btns { margin-top: 26px; }
.m .map { min-height: 260px; }
.m .foot { padding-bottom: 120px; }
.m .foot__row { flex-direction: column; align-items: flex-start; }
.m .dock { position: fixed; left: 0; width: 390px; bottom: 0; z-index: 10; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; padding: 10px 12px 14px; background: var(--dock-bg, rgba(255, 255, 255, .94)); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px -18px rgba(0, 0, 0, .3); }
.m .dock a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 58px; border-radius: 16px; background: var(--soft); color: var(--ink); font-size: 13px; font-weight: 700; }
.m .dock a:first-child { flex-direction: row; gap: 10px; background: #1faa53; color: #fff; font-size: 17px; }
.m .dock .i { width: 22px; height: 22px; }
.m .dock a:not(:first-child) .i { color: var(--c1-ink, var(--c1)); }
</style>
</head>
