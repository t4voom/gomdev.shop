<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Exemplo de projeto: "Lumen Odonto", clínica fictícia (versão celular) -->
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0d2b3a" flood-opacity=".12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f5f4"/>
      <stop offset=".55" stop-color="#f6fbfb"/>
    </linearGradient>
  </defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="360" cy="170" r="120" fill="#d5eeeb"/>

  <!-- Barra de status -->
  <g fill="#0d2b3a">
    <text x="46" y="37" class="s" font-size="16" font-weight="600">9:41</text>
    <rect x="292" y="29" width="3" height="5" rx="1"/><rect x="297" y="27" width="3" height="7" rx="1"/>
    <rect x="302" y="25" width="3" height="9" rx="1"/><rect x="307" y="23" width="3" height="11" rx="1"/>
    <path d="M316 27.5a9 9 0 0 1 12 0l-1.6 1.7a6.6 6.6 0 0 0-8.8 0zM319.2 30.8a4.6 4.6 0 0 1 5.6 0L322 33.7z"/>
    <rect x="336.5" y="23.5" width="23" height="11" rx="3.5" fill="none" stroke="#0d2b3a" stroke-opacity=".4"/>
    <rect x="338.5" y="25.5" width="17" height="7" rx="2"/>
    <rect x="361" y="27" width="1.6" height="4" rx=".8" fill-opacity=".4"/>
  </g>

  <!-- Navegação -->
  <path d="M30 78c-6 0-9 4-9 9 0 7 3 9 4 15 .8 4 1.6 7 3.6 7 2.4 0 2-6 4.4-6s2 6 4.4 6c2 0 2.8-3 3.6-7 1-6 4-8 4-15 0-5-3-9-9-9-2.2 0-3.3 1.2-5 1.2S32.2 78 30 78z" fill="#0e7c7b"/>
  <text x="60" y="100" class="s" font-size="20" fill="#0d2b3a"><tspan font-weight="800">Lumen</tspan><tspan font-weight="400" fill="#0b6b69"> odonto</tspan></text>
  <circle cx="352" cy="94" r="20" fill="#fff"/>
  <path d="M344 89h16M344 95h16M344 101h10" stroke="#0d2b3a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Texto -->
  <rect x="24" y="140" width="232" height="30" rx="15" fill="#d5eeeb"/>
  <text x="40" y="160" class="s" font-size="12" font-weight="700" fill="#0b5f5e">Clínica odontológica · Blumenau</text>
  <g class="s" font-size="38" font-weight="800" fill="#0d2b3a" letter-spacing="-1.2">
    <text x="22" y="218">Sorria sem</text>
    <text x="22" y="262">medo de</text>
    <text x="22" y="306" fill="#0e7c7b">dentista.</text>
  </g>
  <g class="s" font-size="15" fill="#4a6470">
    <text x="24" y="342">Atendimento sem pressa, anestesia sem</text>
    <text x="24" y="364">dor e horários que cabem na sua rotina.</text>
  </g>
  <rect x="24" y="390" width="342" height="54" rx="27" fill="#0e7c7b"/>
  <text x="195" y="423" class="s" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Agendar avaliação</text>

  <!-- Agendamento -->
  <g filter="url(#card)">
    <rect x="16" y="472" width="358" height="318" rx="28" fill="#fff"/>
  </g>
  <g class="s">
    <text x="40" y="512" font-size="17" font-weight="800" fill="#0d2b3a">Escolha um horário</text>
    <text x="350" y="512" font-size="13" fill="#5b7580" text-anchor="end">Outubro</text>

    <g font-size="11" text-anchor="middle">
      <rect x="36" y="530" width="56" height="64" rx="16" fill="none" stroke="#d5e4e6"/>
      <text x="64" y="554" fill="#5b7580">Seg</text><text x="64" y="578" font-size="17" font-weight="700" fill="#0d2b3a">19</text>
      <rect x="100" y="530" width="56" height="64" rx="16" fill="#0e7c7b"/>
      <text x="128" y="554" fill="#d5eeeb">Ter</text><text x="128" y="578" font-size="17" font-weight="700" fill="#fff">20</text>
      <rect x="164" y="530" width="56" height="64" rx="16" fill="none" stroke="#d5e4e6"/>
      <text x="192" y="554" fill="#5b7580">Qua</text><text x="192" y="578" font-size="17" font-weight="700" fill="#0d2b3a">21</text>
      <rect x="228" y="530" width="56" height="64" rx="16" fill="none" stroke="#d5e4e6"/>
      <text x="256" y="554" fill="#5b7580">Qui</text><text x="256" y="578" font-size="17" font-weight="700" fill="#0d2b3a">22</text>
      <rect x="292" y="530" width="56" height="64" rx="16" fill="none" stroke="#d5e4e6"/>
      <text x="320" y="554" fill="#5b7580">Sex</text><text x="320" y="578" font-size="17" font-weight="700" fill="#0d2b3a">23</text>
    </g>

    <g font-size="14" font-weight="600" text-anchor="middle" fill="#0d2b3a">
      <rect x="36" y="612" width="100" height="40" rx="12" fill="#f2f7f8"/><text x="86" y="637">08:30</text>
      <rect x="145" y="612" width="100" height="40" rx="12" fill="#f2f7f8"/><text x="195" y="637">10:00</text>
      <rect x="254" y="612" width="100" height="40" rx="12" fill="#f2f7f8"/><text x="304" y="637">11:30</text>
      <rect x="36" y="660" width="100" height="40" rx="12" fill="#0d2b3a"/><text x="86" y="685" fill="#fff">14:00</text>
      <rect x="145" y="660" width="100" height="40" rx="12" fill="#f2f7f8"/><text x="195" y="685">15:30</text>
      <rect x="254" y="660" width="100" height="40" rx="12" fill="#f2f7f8"/><text x="304" y="685">17:00</text>
    </g>

    <rect x="36" y="720" width="318" height="50" rx="25" fill="#0e7c7b"/>
    <text x="195" y="751" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Confirmar ter, 20/10 às 14:00</text>
  </g>

  <!-- Tratamentos -->
  <text x="24" y="828" class="s" font-size="17" font-weight="800" fill="#0d2b3a">Nossos tratamentos</text>
</svg>
