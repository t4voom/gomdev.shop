<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Exemplo de projeto: "Bruma Café", cafeteria fictícia (versão celular) -->
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d49a5f"/>
      <stop offset="1" stop-color="#6b3f22"/>
    </linearGradient>
    <radialGradient id="coffee" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8a5130"/>
      <stop offset="1" stop-color="#55301a"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="18" stdDeviation="14" flood-color="#2a160a" flood-opacity=".45"/>
    </filter>
    <g id="bean">
      <ellipse rx="9" ry="12.5" fill="#3b2314"/>
      <path d="M0 -10c-4 6 4 14 0 20" stroke="#1f120a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .f { font-family: Georgia, "Times New Roman", serif; }
  </style>

  <rect width="390" height="844" fill="#17110e"/>

  <!-- Barra de status -->
  <g fill="#fff">
    <text x="46" y="37" class="s" font-size="16" font-weight="600">9:41</text>
    <rect x="292" y="29" width="3" height="5" rx="1"/><rect x="297" y="27" width="3" height="7" rx="1"/>
    <rect x="302" y="25" width="3" height="9" rx="1"/><rect x="307" y="23" width="3" height="11" rx="1"/>
    <path d="M316 27.5a9 9 0 0 1 12 0l-1.6 1.7a6.6 6.6 0 0 0-8.8 0zM319.2 30.8a4.6 4.6 0 0 1 5.6 0L322 33.7z"/>
    <rect x="336.5" y="23.5" width="23" height="11" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".45"/>
    <rect x="338.5" y="25.5" width="17" height="7" rx="2"/>
    <rect x="361" y="27" width="1.6" height="4" rx=".8" fill-opacity=".45"/>
  </g>

  <!-- Navegação -->
  <text x="24" y="98" class="f" font-size="26" fill="#f1e4d3">Bruma</text>
  <text x="112" y="97" class="s" font-size="10" font-weight="700" letter-spacing="3" fill="#d4965a">CAFÉ</text>
  <g stroke="#f1e4d3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 84h22l-2.4 20h-17.2zM345 84v-2.5a6 6 0 0 1 12 0V84"/>
  </g>

  <!-- Imagem principal: xícara vista de cima -->
  <rect x="16" y="122" width="358" height="300" rx="30" fill="url(#hero)"/>
  <use href="#bean" transform="translate(66 170) rotate(-30)"/>
  <use href="#bean" transform="translate(92 196) rotate(20)"/>
  <use href="#bean" transform="translate(318 368) rotate(40)"/>
  <use href="#bean" transform="translate(300 396) rotate(-10)"/>
  <use href="#bean" transform="translate(330 164) rotate(70)"/>
  <g filter="url(#drop)">
    <circle cx="195" cy="272" r="112" fill="#efe6da"/>
  </g>
  <circle cx="195" cy="272" r="96" fill="none" stroke="#e0d3c2" stroke-width="2"/>
  <rect x="268" y="258" width="62" height="28" rx="14" fill="#fbf6ef"/>
  <circle cx="195" cy="272" r="80" fill="#fbf6ef"/>
  <circle cx="195" cy="272" r="66" fill="url(#coffee)"/>
  <!-- Latte art -->
  <path d="M195 312c-26-18-40-32-40-48a18 18 0 0 1 40-6 18 18 0 0 1 40 6c0 16-14 30-40 48z" fill="#ecd3b3"/>
  <path d="M195 300c-14-10-22-18-22-27a10 10 0 0 1 22-3 10 10 0 0 1 22 3c0 9-8 17-22 27z" fill="#8a5130" fill-opacity=".55"/>
  <path d="M195 312v-60" stroke="#ecd3b3" stroke-width="3" stroke-linecap="round"/>

  <!-- Texto -->
  <text x="22" y="486" class="f" font-size="44" fill="#f1e4d3" letter-spacing="-.5">Café coado</text>
  <text x="22" y="534" class="f" font-size="44" font-style="italic" fill="#d4965a" letter-spacing="-.5">devagar.</text>
  <g class="s" font-size="15" fill="#b9a896">
    <text x="24" y="572">Grãos especiais de Santa Catarina,</text>
    <text x="24" y="594">torrados aqui mesmo, toda semana.</text>
  </g>

  <!-- Abas do cardápio -->
  <g class="s" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="24" y="620" width="84" height="38" rx="19" fill="#f1e4d3"/><text x="66" y="644" fill="#17110e">Cafés</text>
    <rect x="116" y="620" width="84" height="38" rx="19" fill="none" stroke="#4a3a30"/><text x="158" y="644" fill="#d9c8b4">Doces</text>
    <rect x="208" y="620" width="100" height="38" rx="19" fill="none" stroke="#4a3a30"/><text x="258" y="644" fill="#d9c8b4">Salgados</text>
  </g>

  <!-- Itens -->
  <g class="s">
    <g transform="translate(24 680)">
      <circle cx="24" cy="26" r="24" fill="#3b2314"/><circle cx="24" cy="26" r="15" fill="#6b3a1f"/>
      <text x="62" y="21" font-size="16" font-weight="600" fill="#f1e4d3">Espresso</text>
      <text x="62" y="41" font-size="13" fill="#a8968a">Blend da casa</text>
      <text x="300" y="21" font-size="15" font-weight="700" fill="#d4965a" text-anchor="end">R$ 7</text>
      <circle cx="330" cy="26" r="15" fill="none" stroke="#4a3a30"/><path d="M324 26h12M330 20v12" stroke="#f1e4d3" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M24 744h342" stroke="#2a201b"/>
    <g transform="translate(24 758)">
      <circle cx="24" cy="26" r="24" fill="#efe6da"/><circle cx="24" cy="26" r="15" fill="#c79a6b"/>
      <text x="62" y="21" font-size="16" font-weight="600" fill="#f1e4d3">Cappuccino</text>
      <text x="62" y="41" font-size="13" fill="#a8968a">Com canela e cacau</text>
      <text x="300" y="21" font-size="15" font-weight="700" fill="#d4965a" text-anchor="end">R$ 13</text>
      <circle cx="330" cy="26" r="15" fill="none" stroke="#4a3a30"/><path d="M324 26h12M330 20v12" stroke="#f1e4d3" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M24 822h342" stroke="#2a201b"/>
    <g transform="translate(24 836)">
      <circle cx="24" cy="26" r="24" fill="#d8b98f"/>
      <text x="62" y="21" font-size="16" font-weight="600" fill="#f1e4d3">Cuca de banana</text>
    </g>
  </g>
</svg>
