<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Exemplo de projeto: "Nórdica Casa", loja de decoração fictícia (versão computador) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b67a"/>
      <stop offset="1" stop-color="#a9803f"/>
    </linearGradient>
  </defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1280" height="800" fill="#f5f2ed"/>

  <!-- Faixa de aviso -->
  <rect width="1280" height="36" fill="#1f1f1c"/>
  <text x="640" y="23" class="s" font-size="13" fill="#e9e5dc" text-anchor="middle" letter-spacing=".3">Frete grátis em Blumenau para compras acima de R$ 299</text>

  <!-- Navegação -->
  <text x="80" y="88" class="s" font-size="27" font-weight="300" fill="#1f1f1c" letter-spacing="1">nórdica</text>
  <circle cx="184" cy="84" r="4" fill="#7d8a6a"/>
  <g class="s" font-size="15" fill="#4a4843">
    <text x="470" y="86">Sala</text>
    <text x="536" y="86">Quarto</text>
    <text x="622" y="86">Iluminação</text>
    <text x="726" y="86">Decoração</text>
    <text x="828" y="86">Ofertas</text>
  </g>
  <g stroke="#1f1f1c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1080" cy="80" r="8"/><path d="M1086 86l6 6"/>
    <path d="M1132 91s-11-6.5-11-13.5a5.5 5.5 0 0 1 11-1.5 5.5 5.5 0 0 1 11 1.5c0 7-11 13.5-11 13.5z"/>
    <path d="M1172 76h20l-2 18h-16zM1177 76v-2a5 5 0 0 1 10 0v2"/>
  </g>
  <circle cx="1196" cy="72" r="9" fill="#7d8a6a"/>
  <text x="1196" y="76.5" class="s" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- Banner -->
  <rect x="80" y="126" width="1120" height="352" rx="28" fill="#e6e0d5"/>
  <text x="140" y="214" class="s" font-size="12" font-weight="700" letter-spacing="3" fill="#5f6b4f">NOVA COLEÇÃO · OUTONO</text>
  <g class="s" font-size="52" font-weight="500" fill="#1f1f1c" letter-spacing="-1.5">
    <text x="137" y="276">Menos coisas.</text>
    <text x="137" y="336">Coisas melhores.</text>
  </g>
  <text x="140" y="380" class="s" font-size="17" fill="#5e5a52">Móveis e objetos feitos para durar anos, não estações.</text>
  <rect x="140" y="406" width="172" height="48" rx="24" fill="#1f1f1c"/>
  <text x="226" y="436" class="s" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Ver coleção</text>

  <!-- Ilustração: luminária de arco, poltrona e mesinha -->
  <ellipse cx="1030" cy="250" rx="150" ry="110" fill="url(#glow)"/>
  <path d="M810 452c-6-150 60-238 200-230" stroke="#1f1f1c" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="810" cy="456" rx="40" ry="9" fill="#1f1f1c"/>
  <path d="M978 236a52 52 0 0 1 104 0z" fill="url(#brass)"/>
  <ellipse cx="1030" cy="237" rx="30" ry="5" fill="#fff4d6"/>
  <!-- poltrona -->
  <rect x="884" y="300" width="170" height="120" rx="40" fill="#7d8a6a"/>
  <rect x="868" y="372" width="206" height="56" rx="24" fill="#6f7c5e"/>
  <rect x="860" y="352" width="34" height="76" rx="17" fill="#7d8a6a"/>
  <rect x="1048" y="352" width="34" height="76" rx="17" fill="#7d8a6a"/>
  <path d="M890 428l-8 30M1052 428l8 30" stroke="#8a6440" stroke-width="7" stroke-linecap="round"/>
  <!-- mesinha e vaso -->
  <ellipse cx="1136" cy="398" rx="44" ry="10" fill="#b58a5e"/>
  <path d="M1116 404l-10 54M1156 404l10 54" stroke="#8a6440" stroke-width="5" stroke-linecap="round"/>
  <path d="M1124 394c-8-18-4-38 12-38s20 20 12 38z" fill="#f5f2ed"/>
  <path d="M1136 356c-4-30-20-44-34-50M1136 356c4-26 18-40 30-44M1136 356v-40" stroke="#6b5a40" stroke-width="2" fill="none" stroke-linecap="round"/>
  <g fill="#9aa585"><circle cx="1102" cy="306" r="5"/><circle cx="1166" cy="312" r="5"/><circle cx="1136" cy="314" r="4"/></g>

  <!-- Mais vendidos -->
  <text x="80" y="536" class="s" font-size="26" font-weight="600" fill="#1f1f1c" letter-spacing="-.5">Mais vendidos</text>
  <text x="1200" y="536" class="s" font-size="15" font-weight="600" fill="#5f6b4f" text-anchor="end">Ver todos →</text>

  <g class="s">
    <!-- Vaso -->
    <g transform="translate(80 560)">
      <rect width="268" height="168" rx="20" fill="#ebe6dd"/>
      <path d="M116 150c-22-30-18-70 6-86h24c24 16 28 56 6 86z" fill="#c98a64"/>
      <path d="M122 64c-10-24-30-34-44-36M134 64c0-26 8-40 22-48M146 64c14-18 32-24 44-22" stroke="#6b5a40" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="0" y="200" font-size="16" font-weight="600" fill="#1f1f1c">Vaso Fjord</text>
      <text x="0" y="224" font-size="15" fill="#5e5a52">R$ 129</text>
    </g>
    <!-- Poltrona pequena -->
    <g transform="translate(364 560)">
      <rect width="268" height="168" rx="20" fill="#ebe6dd"/>
      <rect x="84" y="36" width="100" height="74" rx="26" fill="#d9c6a7"/>
      <rect x="74" y="92" width="120" height="34" rx="15" fill="#cdb893"/>
      <path d="M90 126l-6 22M178 126l6 22" stroke="#8a6440" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="200" font-size="16" font-weight="600" fill="#1f1f1c">Poltrona Lume</text>
      <text x="0" y="224" font-size="15" fill="#5e5a52">R$ 1.490</text>
    </g>
    <!-- Pendente -->
    <g transform="translate(648 560)">
      <rect width="268" height="168" rx="20" fill="#ebe6dd"/>
      <path d="M134 0v58" stroke="#1f1f1c" stroke-width="2"/>
      <path d="M86 112a48 48 0 0 1 96 0z" fill="#1f1f1c"/>
      <ellipse cx="134" cy="118" rx="36" ry="12" fill="url(#glow)"/>
      <circle cx="134" cy="114" r="8" fill="#fff4d6"/>
      <text x="0" y="200" font-size="16" font-weight="600" fill="#1f1f1c">Pendente Aro</text>
      <text x="0" y="224" font-size="15" fill="#5e5a52">R$ 349</text>
    </g>
    <!-- Manta -->
    <g transform="translate(932 560)">
      <rect width="268" height="168" rx="20" fill="#ebe6dd"/>
      <rect x="64" y="96" width="140" height="34" rx="12" fill="#7d8a6a"/>
      <rect x="72" y="70" width="124" height="32" rx="12" fill="#a3ad90"/>
      <rect x="80" y="46" width="108" height="30" rx="12" fill="#d9c6a7"/>
      <path d="M84 104h100M92 80h84M98 56h72" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>
      <text x="0" y="200" font-size="16" font-weight="600" fill="#1f1f1c">Manta Tricô</text>
      <text x="0" y="224" font-size="15" fill="#5e5a52">R$ 189</text>
    </g>
  </g>
</svg>
