<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Exemplo de projeto: "Brasa Norte", restaurante fictício (versão celular) -->
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3a2c24"/>
      <stop offset="1" stop-color="#17100c"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3219"/>
      <stop offset="1" stop-color="#4a1d0f"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0826a"/>
      <stop offset="1" stop-color="#b9503b"/>
    </linearGradient>
    <g id="slice">
      <rect x="-22" y="-50" width="44" height="100" rx="16" fill="url(#crust)"/>
      <rect x="-16" y="-38" width="32" height="82" rx="12" fill="url(#pink)"/>
      <rect x="-22" y="-50" width="44" height="17" rx="8.5" fill="#efd6b0"/>
    </g>
  </defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .f { font-family: Georgia, "Times New Roman", serif; }
  </style>

  <rect width="390" height="844" fill="#120c09"/>
  <circle cx="195" cy="250" r="230" fill="url(#ember)"/>

  <!-- Barra de status -->
  <g fill="#fff">
    <text x="46" y="37" class="s" font-size="16" font-weight="600">9:41</text>
    <rect x="292" y="29" width="3" height="5" rx="1"/><rect x="297" y="27" width="3" height="7" rx="1"/>
    <rect x="302" y="25" width="3" height="9" rx="1"/><rect x="307" y="23" width="3" height="11" rx="1"/>
    <path d="M316 27.5a9 9 0 0 1 12 0l-1.6 1.7a6.6 6.6 0 0 0-8.8 0zM319.2 30.8a4.6 4.6 0 0 1 5.6 0L322 33.7z"/>
    <rect x="336.5" y="23.5" width="23" height="11" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".45"/>
    <rect x="338.5" y="25.5" width="17" height="7" rx="2"/>
    <rect x="361" y="27" width="1.6" height="4" rx=".8" fill-opacity=".45"/>
  </g>

  <!-- Navegação -->
  <g transform="translate(24 76)">
    <path d="M10 0c2.2 6 9 9 9 18a9 9 0 0 1-18 0c0-4.5 2.2-6.8 3.8-9 .7 3 2.2 4.5 3.8 4.5-.8-4.5 0-9 1.4-13.5z" fill="#ff6a3d"/>
    <text x="30" y="21" class="f" font-size="20" font-weight="700" fill="#f6ede4">Brasa Norte</text>
  </g>
  <path d="M344 86h22M344 94h22M350 102h16" stroke="#f6ede4" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Prato -->
  <circle cx="195" cy="262" r="128" fill="url(#plate)"/>
  <circle cx="195" cy="262" r="127" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1.5"/>
  <circle cx="195" cy="262" r="98" fill="#2a1e18"/>
  <g transform="translate(195 270)">
    <use href="#slice" transform="translate(-64 10) rotate(-34)"/>
    <use href="#slice" transform="translate(-23 -4) rotate(-12)"/>
    <use href="#slice" transform="translate(20 -5) rotate(10)"/>
    <use href="#slice" transform="translate(61 9) rotate(32)"/>
  </g>
  <g transform="translate(136 196) rotate(-28)">
    <path d="M0 0c22 5 50 5 82 0" stroke="#5f7a34" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <g fill="#7f9b45">
      <ellipse cx="12" cy="-3" rx="6" ry="2.4" transform="rotate(-30 12 -3)"/>
      <ellipse cx="14" cy="5" rx="6" ry="2.4" transform="rotate(30 14 5)"/>
      <ellipse cx="30" cy="-1" rx="6" ry="2.4" transform="rotate(-30 30 -1)"/>
      <ellipse cx="32" cy="7" rx="6" ry="2.4" transform="rotate(30 32 7)"/>
      <ellipse cx="50" cy="0" rx="6" ry="2.4" transform="rotate(-30 50 0)"/>
      <ellipse cx="52" cy="7" rx="6" ry="2.4" transform="rotate(30 52 7)"/>
    </g>
  </g>
  <circle cx="254" cy="346" r="12" fill="#d7472e"/>
  <circle cx="250" cy="341" r="3.5" fill="#fff" fill-opacity=".35"/>
  <circle cx="276" cy="330" r="10" fill="#c93a23"/>

  <!-- Texto -->
  <text x="24" y="440" class="s" font-size="11" font-weight="700" letter-spacing="2.5" fill="#ff8a5c">COZINHA NA BRASA · BLUMENAU</text>
  <text x="22" y="490" class="f" font-size="42" fill="#f6ede4" letter-spacing="-.5">Fogo lento,</text>
  <text x="22" y="536" class="f" font-size="42" fill="#f6ede4" letter-spacing="-.5"><tspan font-style="italic" fill="#ff8a5c">sabor</tspan> que fica.</text>
  <g class="s" font-size="15" fill="#bfae9f">
    <text x="24" y="574">Carnes na brasa, massas da casa e uma</text>
    <text x="24" y="596">carta de vinhos escolhida a dedo.</text>
  </g>
  <rect x="24" y="622" width="342" height="54" rx="27" fill="#ff6a3d"/>
  <text x="195" y="655" class="s" font-size="17" font-weight="600" fill="#1a0f0a" text-anchor="middle">Reservar mesa</text>

  <!-- Cardápio -->
  <text x="24" y="720" class="s" font-size="13" font-weight="600" fill="#a8968a">Destaques da casa</text>
  <g class="s">
    <rect x="24" y="736" width="342" height="76" rx="20" fill="#1c140f" stroke="#fff" stroke-opacity=".06"/>
    <circle cx="62" cy="774" r="22" fill="#7a3219"/><circle cx="62" cy="774" r="14" fill="#d0705a"/>
    <text x="98" y="768" font-size="16" font-weight="600" fill="#f6ede4">Picanha na brasa</text>
    <text x="98" y="790" font-size="13" fill="#a8968a">300 g · farofa e vinagrete</text>
    <text x="346" y="768" font-size="16" font-weight="600" fill="#ff8a5c" text-anchor="end">R$ 89</text>
    <rect x="24" y="822" width="342" height="76" rx="20" fill="#1c140f" stroke="#fff" stroke-opacity=".06"/>
    <circle cx="62" cy="860" r="22" fill="#5a2a18"/>
    <text x="98" y="854" font-size="16" font-weight="600" fill="#f6ede4">Costela 12 horas</text>
  </g>
</svg>
