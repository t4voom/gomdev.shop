<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Exemplo de projeto: "Brasa Norte", restaurante fictício (versão computador) -->
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#ff6a3d" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3a2c24"/>
      <stop offset="1" stop-color="#17100c"/>
    </radialGradient>
    <radialGradient id="plateIn" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#33251d"/>
      <stop offset="1" stop-color="#211711"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3219"/>
      <stop offset="1" stop-color="#4a1d0f"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0826a"/>
      <stop offset="1" stop-color="#b9503b"/>
    </linearGradient>
    <g id="slice">
      <rect x="-40" y="-92" width="80" height="184" rx="30" fill="url(#crust)"/>
      <rect x="-30" y="-70" width="60" height="150" rx="22" fill="url(#pink)"/>
      <rect x="-40" y="-92" width="80" height="30" rx="15" fill="#efd6b0"/>
      <path d="M-26 -30h52M-26 10h52M-26 50h52" stroke="#3b140a" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    </g>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .f { font-family: Georgia, "Times New Roman", serif; }
  </style>

  <rect width="1280" height="800" fill="#120c09"/>
  <circle cx="940" cy="380" r="470" fill="url(#ember)"/>

  <!-- Navegação -->
  <g transform="translate(80 38)">
    <path d="M14 0c3 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 5-12 1 4 3 6 5 6-1-6 0-12 2-18z" fill="#ff6a3d"/>
    <text x="40" y="25" class="f" font-size="24" font-weight="700" fill="#f6ede4">Brasa Norte</text>
  </g>
  <g class="s" font-size="15" fill="#c9b8a9">
    <text x="600" y="62">Cardápio</text>
    <text x="700" y="62">Reservas</text>
    <text x="800" y="62">Sobre</text>
    <text x="880" y="62">Contato</text>
  </g>
  <rect x="1050" y="34" width="150" height="44" rx="22" fill="#ff6a3d"/>
  <text x="1125" y="61" class="s" font-size="15" font-weight="600" fill="#1a0f0a" text-anchor="middle">Reservar mesa</text>

  <!-- Texto principal -->
  <text x="80" y="214" class="s" font-size="13" font-weight="700" letter-spacing="3" fill="#ff8a5c">COZINHA NA BRASA · BLUMENAU</text>
  <text x="76" y="304" class="f" font-size="78" fill="#f6ede4" letter-spacing="-1">Fogo lento,</text>
  <text x="76" y="390" class="f" font-size="78" fill="#f6ede4" letter-spacing="-1"><tspan font-style="italic" fill="#ff8a5c">sabor</tspan> que fica.</text>
  <g class="s" font-size="19" fill="#bfae9f">
    <text x="80" y="446">Carnes na brasa, massas da casa e uma carta de</text>
    <text x="80" y="476">vinhos escolhida a dedo. Reserve em segundos.</text>
  </g>
  <rect x="80" y="516" width="190" height="56" rx="28" fill="#ff6a3d"/>
  <text x="175" y="550" class="s" font-size="17" font-weight="600" fill="#1a0f0a" text-anchor="middle">Ver cardápio</text>
  <rect x="287" y="517" width="168" height="54" rx="27" fill="none" stroke="#5a4336" stroke-width="2"/>
  <text x="371" y="550" class="s" font-size="17" font-weight="600" fill="#f6ede4" text-anchor="middle">Reservar</text>
  <g class="s" font-size="15" fill="#a8968a">
    <circle cx="88" cy="613" r="7" fill="none" stroke="#ff8a5c" stroke-width="2"/>
    <path d="M88 609v4l2.5 2" stroke="#ff8a5c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="104" y="618">Aberto hoje · 18h às 23h</text>
    <path d="M300 606a6 6 0 0 1 12 0c0 5-6 11-6 11s-6-6-6-11z" fill="none" stroke="#ff8a5c" stroke-width="2"/>
    <text x="322" y="618">Centro, Blumenau</text>
  </g>

  <!-- Prato -->
  <g filter="url(#soft)">
    <circle cx="940" cy="380" r="248" fill="url(#plate)"/>
  </g>
  <circle cx="940" cy="380" r="247" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
  <circle cx="940" cy="380" r="190" fill="url(#plateIn)"/>
  <g transform="translate(940 392)">
    <use href="#slice" transform="translate(-118 18) rotate(-34)"/>
    <use href="#slice" transform="translate(-44 -8) rotate(-12)"/>
    <use href="#slice" transform="translate(36 -10) rotate(10)"/>
    <use href="#slice" transform="translate(112 16) rotate(32)"/>
  </g>
  <!-- Alecrim -->
  <g transform="translate(830 250) rotate(-28)">
    <path d="M0 0c40 10 90 10 150 0" stroke="#5f7a34" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#7f9b45">
      <ellipse cx="20" cy="-6" rx="11" ry="4" transform="rotate(-30 20 -6)"/>
      <ellipse cx="22" cy="8" rx="11" ry="4" transform="rotate(30 22 8)"/>
      <ellipse cx="50" cy="-2" rx="11" ry="4" transform="rotate(-30 50 -2)"/>
      <ellipse cx="54" cy="12" rx="11" ry="4" transform="rotate(30 54 12)"/>
      <ellipse cx="82" cy="0" rx="11" ry="4" transform="rotate(-30 82 0)"/>
      <ellipse cx="86" cy="13" rx="11" ry="4" transform="rotate(30 86 13)"/>
      <ellipse cx="114" cy="-2" rx="11" ry="4" transform="rotate(-30 114 -2)"/>
      <ellipse cx="118" cy="10" rx="11" ry="4" transform="rotate(30 118 10)"/>
    </g>
  </g>
  <!-- Tomates -->
  <g>
    <circle cx="1052" cy="532" r="22" fill="#d7472e"/>
    <circle cx="1045" cy="524" r="6" fill="#fff" fill-opacity=".35"/>
    <circle cx="1090" cy="506" r="18" fill="#c93a23"/>
    <circle cx="1085" cy="500" r="5" fill="#fff" fill-opacity=".3"/>
  </g>
  <!-- Sal grosso -->
  <g fill="#fff" fill-opacity=".75">
    <rect x="880" y="530" width="5" height="5" rx="1" transform="rotate(20 880 530)"/>
    <rect x="905" y="545" width="4" height="4" rx="1"/>
    <rect x="960" y="552" width="5" height="5" rx="1" transform="rotate(40 960 552)"/>
    <rect x="990" y="236" width="4" height="4" rx="1"/>
    <rect x="1010" y="252" width="5" height="5" rx="1" transform="rotate(15 1010 252)"/>
  </g>
  <!-- Molheira de chimichurri -->
  <circle cx="1150" cy="590" r="52" fill="#1d1511" filter="url(#soft)"/>
  <circle cx="1150" cy="590" r="40" fill="#56702a"/>
  <g fill="#8fae4f">
    <circle cx="1136" cy="580" r="4"/><circle cx="1160" cy="600" r="3"/><circle cx="1152" cy="574" r="3"/>
    <circle cx="1140" cy="604" r="3"/><circle cx="1166" cy="582" r="4"/>
  </g>
  <g fill="#c8452c"><circle cx="1148" cy="590" r="3"/><circle cx="1128" cy="594" r="2.5"/></g>

  <!-- Destaques do cardápio -->
  <g class="s">
    <g transform="translate(80 660)">
      <rect width="360" height="104" rx="22" fill="#1c140f" stroke="#fff" stroke-opacity=".06"/>
      <circle cx="52" cy="52" r="30" fill="#7a3219"/><circle cx="52" cy="52" r="20" fill="#d0705a"/>
      <text x="100" y="46" font-size="18" font-weight="600" fill="#f6ede4">Picanha na brasa</text>
      <text x="100" y="70" font-size="14" fill="#a8968a">300 g · farofa e vinagrete</text>
      <text x="332" y="46" font-size="18" font-weight="600" fill="#ff8a5c" text-anchor="end">R$ 89</text>
    </g>
    <g transform="translate(460 660)">
      <rect width="360" height="104" rx="22" fill="#1c140f" stroke="#fff" stroke-opacity=".06"/>
      <circle cx="52" cy="52" r="30" fill="#5a2a18"/><rect x="34" y="40" width="36" height="24" rx="8" fill="#a8583a"/>
      <text x="100" y="46" font-size="18" font-weight="600" fill="#f6ede4">Costela 12 horas</text>
      <text x="100" y="70" font-size="14" fill="#a8968a">Assada devagar no fogo</text>
      <text x="332" y="46" font-size="18" font-weight="600" fill="#ff8a5c" text-anchor="end">R$ 74</text>
    </g>
    <g transform="translate(840 660)">
      <rect width="360" height="104" rx="22" fill="#1c140f" stroke="#fff" stroke-opacity=".06"/>
      <circle cx="52" cy="52" r="30" fill="#e9d9b8"/><circle cx="44" cy="46" r="7" fill="#7a5a3a"/><circle cx="60" cy="58" r="6" fill="#7a5a3a"/><circle cx="58" cy="42" r="4" fill="#6f8f3a"/>
      <text x="100" y="46" font-size="18" font-weight="600" fill="#f6ede4">Risoto de funghi</text>
      <text x="100" y="70" font-size="14" fill="#a8968a">A opção vegetariana da casa</text>
      <text x="332" y="46" font-size="18" font-weight="600" fill="#ff8a5c" text-anchor="end">R$ 62</text>
    </g>
  </g>
</svg>
