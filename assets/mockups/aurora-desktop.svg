<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Exemplo de projeto: "Aurora Pet", pet shop fictício (versão computador) -->
  <defs>
    <clipPath id="blob"><circle cx="930" cy="392" r="252"/></clipPath>
    <radialGradient id="sun" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffc9a3"/>
      <stop offset="1" stop-color="#ff9f6e"/>
    </radialGradient>
    <filter id="card" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7a3b12" flood-opacity=".16"/>
    </filter>
  </defs>
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1280" height="800" fill="#fff8f1"/>
  <circle cx="1210" cy="90" r="160" fill="#ffeadb"/>

  <!-- Navegação -->
  <g transform="translate(80 40)" fill="#ff6b35">
    <ellipse cx="16" cy="22" rx="10" ry="8.5"/>
    <ellipse cx="4" cy="11" rx="3.8" ry="5" transform="rotate(-20 4 11)"/>
    <ellipse cx="12" cy="4" rx="3.8" ry="5"/>
    <ellipse cx="21" cy="4" rx="3.8" ry="5"/>
    <ellipse cx="29" cy="11" rx="3.8" ry="5" transform="rotate(20 29 11)"/>
  </g>
  <text x="122" y="64" class="s" font-size="23" font-weight="800" fill="#2b1b12" letter-spacing="-.5">Aurora Pet</text>
  <g class="s" font-size="15" fill="#6b5a4e">
    <text x="560" y="63">Serviços</text>
    <text x="656" y="63">Banho e tosa</text>
    <text x="782" y="63">Produtos</text>
    <text x="878" y="63">Contato</text>
  </g>
  <rect x="1044" y="36" width="156" height="44" rx="22" fill="#2b1b12"/>
  <text x="1122" y="63" class="s" font-size="15" font-weight="700" fill="#fff8f1" text-anchor="middle">Agendar banho</text>

  <!-- Texto principal -->
  <rect x="80" y="172" width="262" height="36" rx="18" fill="#ffe4d2"/>
  <circle cx="102" cy="190" r="5" fill="#ff6b35"/>
  <text x="116" y="195" class="s" font-size="14" font-weight="700" fill="#b8481a">Banho e tosa em Blumenau</text>
  <g class="s" font-size="64" font-weight="800" fill="#2b1b12" letter-spacing="-2">
    <text x="76" y="284">Banho e tosa com</text>
    <text x="76" y="356"><tspan fill="#ff6b35">carinho</tspan> de verdade.</text>
  </g>
  <g class="s" font-size="19" fill="#6b5a4e">
    <text x="80" y="412">Seu pet volta cheiroso, feliz e sem estresse.</text>
    <text x="80" y="442">Busca e entrega grátis no seu bairro.</text>
  </g>
  <rect x="80" y="480" width="262" height="58" rx="29" fill="#ff6b35"/>
  <text x="211" y="515" class="s" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Agendar pelo WhatsApp</text>
  <text x="372" y="515" class="s" font-size="17" font-weight="700" fill="#2b1b12">Ver serviços →</text>
  <g class="s" font-size="15" fill="#6b5a4e">
    <circle cx="92" cy="598" r="12" fill="#ffe4d2"/>
    <path d="M86.5 598l4 4 7-8" stroke="#ff6b35" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="603">Produtos hipoalergênicos</text>
    <circle cx="316" cy="598" r="12" fill="#ffe4d2"/>
    <path d="M310.5 598l4 4 7-8" stroke="#ff6b35" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="338" y="603">Hora marcada, sem espera</text>
  </g>

  <!-- Ilustração: cachorro dentro do círculo -->
  <circle cx="930" cy="392" r="252" fill="url(#sun)"/>
  <g clip-path="url(#blob)">
    <circle cx="930" cy="392" r="180" fill="#fff" fill-opacity=".18"/>
    <ellipse cx="930" cy="640" rx="170" ry="130" fill="#e9a063"/>
    <ellipse cx="930" cy="610" rx="80" ry="70" fill="#fbe6cf"/>
    <!-- orelhas -->
    <ellipse cx="826" cy="360" rx="46" ry="92" fill="#b8703d" transform="rotate(22 826 360)"/>
    <ellipse cx="1034" cy="360" rx="46" ry="92" fill="#b8703d" transform="rotate(-22 1034 360)"/>
    <!-- cabeça -->
    <circle cx="930" cy="372" r="122" fill="#f0b077"/>
    <path d="M930 252c-14 30-14 64 0 96 14-32 14-66 0-96z" fill="#fbe6cf"/>
    <ellipse cx="930" cy="430" rx="74" ry="58" fill="#fbe6cf"/>
    <!-- olhos -->
    <circle cx="884" cy="362" r="12" fill="#2b1b12"/>
    <circle cx="976" cy="362" r="12" fill="#2b1b12"/>
    <circle cx="888" cy="357" r="4" fill="#fff"/>
    <circle cx="980" cy="357" r="4" fill="#fff"/>
    <!-- focinho -->
    <ellipse cx="930" cy="410" rx="21" ry="15" fill="#2b1b12"/>
    <ellipse cx="924" cy="405" rx="6" ry="3.5" fill="#fff" fill-opacity=".45"/>
    <path d="M930 425v14M906 440c10 12 38 12 48 0" stroke="#2b1b12" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M920 446c0 18 20 18 20 0z" fill="#ff7f8f"/>
    <!-- coleira -->
    <path d="M838 488c56 30 128 30 184 0v22c-56 30-128 30-184 0z" fill="#ff6b35"/>
    <circle cx="930" cy="530" r="17" fill="#ffd166"/>
    <circle cx="930" cy="530" r="7" fill="none" stroke="#c9981f" stroke-width="2.5"/>
  </g>

  <!-- Cartões flutuantes -->
  <g filter="url(#card)" class="s">
    <rect x="1046" y="176" width="200" height="78" rx="20" fill="#fff"/>
    <rect x="1064" y="195" width="40" height="40" rx="12" fill="#ffe4d2"/>
    <rect x="1073" y="205" width="22" height="20" rx="4" fill="none" stroke="#ff6b35" stroke-width="2.4"/>
    <path d="M1073 212h22M1079 202v6M1089 202v6" stroke="#ff6b35" stroke-width="2.4" stroke-linecap="round"/>
    <text x="1118" y="209" font-size="12" fill="#8a776a">Próximo horário</text>
    <text x="1118" y="231" font-size="17" font-weight="800" fill="#2b1b12">Hoje, 15h30</text>
  </g>
  <g filter="url(#card)" class="s">
    <rect x="640" y="556" width="214" height="68" rx="20" fill="#fff"/>
    <circle cx="676" cy="590" r="18" fill="#dff5e8"/>
    <path d="M668 590l6 6 10-11" stroke="#1f9d55" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="706" y="585" font-size="15" font-weight="800" fill="#2b1b12">Tosa higiênica</text>
    <text x="706" y="605" font-size="12" fill="#8a776a">Pronto em 1 hora</text>
  </g>

  <!-- Serviços -->
  <g class="s">
    <g transform="translate(80 676)">
      <rect width="360" height="92" rx="22" fill="#fff" stroke="#f3e1d3"/>
      <rect x="22" y="22" width="48" height="48" rx="14" fill="#ffe4d2"/>
      <path d="M34 48h24v4a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8zM38 48v-12a4 4 0 0 1 8 0" stroke="#ff6b35" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="42" font-size="18" font-weight="800" fill="#2b1b12">Banho</text>
      <text x="88" y="64" font-size="14" fill="#8a776a">a partir de R$ 45</text>
    </g>
    <g transform="translate(460 676)">
      <rect width="360" height="92" rx="22" fill="#fff" stroke="#f3e1d3"/>
      <rect x="22" y="22" width="48" height="48" rx="14" fill="#ffe4d2"/>
      <circle cx="38" cy="56" r="5" stroke="#ff6b35" stroke-width="2.4" fill="none"/>
      <circle cx="54" cy="56" r="5" stroke="#ff6b35" stroke-width="2.4" fill="none"/>
      <path d="M41 52l13-18M51 52L38 34" stroke="#ff6b35" stroke-width="2.4" stroke-linecap="round"/>
      <text x="88" y="42" font-size="18" font-weight="800" fill="#2b1b12">Tosa</text>
      <text x="88" y="64" font-size="14" fill="#8a776a">a partir de R$ 70</text>
    </g>
    <g transform="translate(840 676)">
      <rect width="360" height="92" rx="22" fill="#fff" stroke="#f3e1d3"/>
      <rect x="22" y="22" width="48" height="48" rx="14" fill="#ffe4d2"/>
      <path d="M33 50l13-10 13 10v10a2 2 0 0 1-2 2H35a2 2 0 0 1-2-2z" stroke="#ff6b35" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
      <text x="88" y="42" font-size="18" font-weight="800" fill="#2b1b12">Hotelzinho</text>
      <text x="88" y="64" font-size="14" fill="#8a776a">diária de R$ 90</text>
    </g>
  </g>
</svg>
